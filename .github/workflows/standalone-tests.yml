name: Isolated pipeline tests
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=8,<10' -r requirements.txt
      - run: python -m pytest -q
      - run: python -m compileall -q facodi_api
